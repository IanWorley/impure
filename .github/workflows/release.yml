name: Release

# Pushing a tag publishes a release built from it:
#   vMAJOR.MINOR.PATCH        a full release
#   vMAJOR.MINOR.PATCH-rc.N   a pre-release (also -beta.N, -alpha.N)
# Deleting the tag deletes the release again (retract-release.yml). Releases contain the runtime
# and its tools, never the game.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate tag
    runs-on: ubuntu-24.04
    outputs:
      prerelease: ${{ steps.tag.outputs.prerelease }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - id: tag
        run: |
          tools/release-tag.sh "$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

  build:
    needs: validate
    uses: ./.github/workflows/build-release.yml
    with:
      version: ${{ needs.validate.outputs.version }}

  publish:
    name: Publish
    needs: [validate, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum -- * > SHA256SUMS
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.validate.outputs.prerelease }}
        run: |
          flags=()
          [[ "$PRERELEASE" == true ]] && flags+=(--prerelease)
          # --verify-tag: if the tag was deleted while this ran, publish nothing.
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes \
            --title "Pure runtime $GITHUB_REF_NAME" "${flags[@]}"
