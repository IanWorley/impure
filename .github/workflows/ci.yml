name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

# CI never has the game, and needs none: the runtime never contains game code. Players build the
# game library from their own copy on their own machine (runtime/src/builder/).
jobs:
  repository:
    name: Repository checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: No game content tracked
        run: tools/check-no-game-content.sh
      - name: Shell scripts
        run: shellcheck tools/*.sh
      - name: Workflows
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color
      - name: Python tools
        run: python3 -m py_compile tools/find_switch_functions.py tools/find_inline_switch_tables.py

  lint:
    name: Format and lint
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: runtime
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: runtime
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings

  # Tests on one Linux runner only; the six platforms are built when a release is tagged
  # (build-release.yml), so pushes and pull requests stay cheap.
  test:
    name: Runtime tests
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: runtime
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: runtime
      - run: cargo test --locked
